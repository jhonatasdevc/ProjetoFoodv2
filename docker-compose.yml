services:
  db:
    image: postgres:16-alpine
    container_name: delivery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-delivery}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-delivery123}
      POSTGRES_DB: ${DB_NAME:-delivery_db}
    ports:
      - "5432:5432"          # exposto no host — Claude Code conecta em localhost:5432
    volumes:
      - delivery_pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d   # scripts .sql aqui rodam na 1ª subida
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-delivery}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - delivery_net

  adminer:
    image: adminer:latest
    container_name: delivery_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"           # interface web pra ver as tabelas: http://localhost:8081
    depends_on:
      - db
    networks:
      - delivery_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: delivery_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-delivery}:${DB_PASSWORD:-delivery123}@db:5432/${DB_NAME:-delivery_db}
      API_PORT: 3333
      JWT_SECRET: ${JWT_SECRET:-troque_esse_segredo_em_producao}
      CORS_ORIGIN: http://localhost:3001,http://localhost:3002
      NODE_ENV: development
    ports:
      - "3333:3333"           # API + Socket.io: http://localhost:3333
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/repo
      - api_node_modules:/repo/node_modules
    networks:
      - delivery_net

  web-loja:
    build:
      context: .
      dockerfile: apps/web-loja/Dockerfile.dev
    container_name: delivery_web_loja
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3333
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3001:3001"           # painel da loja: http://localhost:3001
    depends_on:
      - api
    volumes:
      - .:/repo
      - web_loja_node_modules:/repo/node_modules
    networks:
      - delivery_net

  web-cliente:
    build:
      context: .
      dockerfile: apps/web-cliente/Dockerfile.dev
    container_name: delivery_web_cliente
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3333
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3002:3002"           # site do cliente: http://localhost:3002
    depends_on:
      - api
    volumes:
      - .:/repo
      - web_cliente_node_modules:/repo/node_modules
    networks:
      - delivery_net

volumes:
  delivery_pgdata:
  api_node_modules:
  web_loja_node_modules:
  web_cliente_node_modules:

networks:
  delivery_net:
    driver: bridge