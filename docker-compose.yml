services:
  db:
    build:
      context: .
      dockerfile: sql/Dockerfile
    container_name: delivery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-delivery}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-delivery123}
      POSTGRES_DB: ${DB_NAME:-delivery_db}
    ports:
      - "127.0.0.1:5432:5432"   # só acessível localmente — nunca exponha o banco pra internet
    volumes:
      - delivery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-delivery}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - delivery_net

  adminer:
    image: adminer:latest
    container_name: delivery_adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"   # só acessível localmente — nunca exponha o Adminer pra internet
    depends_on:
      - db
    networks:
      - delivery_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: delivery_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-delivery}:${DB_PASSWORD:-delivery123}@db:5432/${DB_NAME:-delivery_db}
      API_PORT: 3333
      JWT_SECRET: ${JWT_SECRET:-troque_esse_segredo_em_producao}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://pedidos.flowdevelop.com.br,https://loja.flowdevelop.com.br,https://admin.flowdevelop.com.br}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-troque_esta_chave_vapid_publica}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-troque_esta_chave_vapid_privada}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contato@flowdevelop.com.br}
      NODE_ENV: production
    ports:
      - "3333:3333"           # API + Socket.io: http://localhost:3333 (local); no VPS o acesso público é via Traefik
    depends_on:
      db:
        condition: service_healthy
    networks:
      - delivery_net
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.delivery-api.rule=Host(`${API_DOMAIN:-api.flowdevelop.com.br}`)
      - traefik.http.routers.delivery-api.entrypoints=websecure
      - traefik.http.routers.delivery-api.tls.certresolver=letsencrypt
      - traefik.http.services.delivery-api.loadbalancer.server.port=3333

  web-loja:
    build:
      context: .
      dockerfile: apps/web-loja/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.flowdevelop.com.br}
    container_name: delivery_web_loja
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3001:3001"           # painel da loja: http://localhost:3001 (local); no VPS o acesso público é via Traefik
    depends_on:
      - api
    networks:
      - delivery_net
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.delivery-web-loja.rule=Host(`${WEB_LOJA_DOMAIN:-loja.flowdevelop.com.br}`)
      - traefik.http.routers.delivery-web-loja.entrypoints=websecure
      - traefik.http.routers.delivery-web-loja.tls.certresolver=letsencrypt
      - traefik.http.services.delivery-web-loja.loadbalancer.server.port=3001

  web-cliente:
    build:
      context: .
      dockerfile: apps/web-cliente/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.flowdevelop.com.br}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-troque_esta_chave_vapid_publica}
    container_name: delivery_web_cliente
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-troque_esta_chave_vapid_publica}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3002:3002"           # site do cliente: http://localhost:3002 (local); no VPS o acesso público é via Traefik
    depends_on:
      - api
    networks:
      - delivery_net
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.delivery-web-cliente.rule=Host(`${WEB_CLIENTE_DOMAIN:-pedidos.flowdevelop.com.br}`)
      - traefik.http.routers.delivery-web-cliente.entrypoints=websecure
      - traefik.http.routers.delivery-web-cliente.tls.certresolver=letsencrypt
      - traefik.http.services.delivery-web-cliente.loadbalancer.server.port=3002

  web-admin:
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.flowdevelop.com.br}
    container_name: delivery_web_admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3003:3003"           # painel admin: http://localhost:3003 (local); no VPS o acesso público é via Traefik
    depends_on:
      - api
    networks:
      - delivery_net
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.delivery-web-admin.rule=Host(`${WEB_ADMIN_DOMAIN:-admin.flowdevelop.com.br}`)
      - traefik.http.routers.delivery-web-admin.entrypoints=websecure
      - traefik.http.routers.delivery-web-admin.tls.certresolver=letsencrypt
      - traefik.http.services.delivery-web-admin.loadbalancer.server.port=3003

volumes:
  delivery_pgdata:

networks:
  delivery_net:
    driver: bridge
  traefik-proxy:
    external: true   # rede já criada pelo Traefik no VPS — não é gerenciada por este compose